<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LOGAN BLINGZ: WEB HERO</title>

    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <div id="hud">
        <h1>LOGAN BLINGZ</h1>
        <div id="mode">CIVILIAN</div>
        <div id="health">❤️ 100</div>
        <div id="energy">⚡ 100</div>
        <div id="mission">Explore Blingz City</div>
    </div>

    <div id="phone">
        <h2>📱 PHONE</h2>

        <button id="momButton">Call Mom</button>
        <button id="dadButton">Call Dad</button>
        <button id="policeButton">Call Police</button>
        <button id="heroButton">Call Skyblade</button>

        <div id="messages"></div>
    </div>

    <div id="controls">
        WASD — Move<br>
        SHIFT — Run<br>
        SPACE — Jump<br>
        B — Hero/Civilian<br>
        O — Phone<br>
        P — Save<br>
        F — Attack
    </div>

    <script type="module" src="./js/game.js"></script>

</body>
</html>
