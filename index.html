<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>LOGAN BLINGZ</title>

    <link
        rel="stylesheet"
        href="./style.css"
    >

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"
        }
    }
    </script>
</head>

<body>

    <!-- GAME TITLE -->
    <div id="title">
        LOGAN BLINGZ
    </div>

    <!-- HEALTH -->
    <div id="health">
        Logan Health: 100
    </div>

    <div id="hero-health">
        Skyblade Health: 100
    </div>

    <div id="villain-health">
        Shadow King Health: 120
    </div>

    <!-- IDENTITY -->
    <div id="identity">
        Identity: Logan
    </div>

    <!-- CONTROLS -->
    <div id="controls">

        <div>W A S D — Move</div>
        <div>SHIFT — Run</div>
        <div>SPACE — Jump</div>
        <div>E — Enter / Exit Vehicle</div>
        <div>I — Change Identity</div>
        <div>M — Start Mission</div>
        <div>F — Logan Attack</div>
        <div>G — Skyblade Attack</div>

    </div>

    <!-- GAME -->
    <script
        type="module"
        src="./js/game.js"
    ></script>

</body>

</html>
