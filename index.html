<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>LOGAN BLINGZ</title>

    <link
        rel="stylesheet"
        href="./style.css"
    >

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"
        }
    }
    </script>
</head>

<body>

    <div id="title">
        LOGAN BLINGZ
    </div>

    <div id="health">
        Logan Health: 100
    </div>

    <div id="hero-health">
        Skyblade Health: 100
    </div>

    <div id="villain-health">
        No Villain Health: 0
    </div>

    <div id="identity">
        Identity: Logan (Student)
    </div>

    <div id="mission">
        Mission: None
    </div>

    <div id="minimap-container">

        <canvas
            id="minimap"
            width="220"
            height="220"
        ></canvas>

    </div>

    <div id="skyblade-call">

        <div id="skyblade-call-title">
            📞 Hero Calling
        </div>

        <div id="skyblade-call-message"></div>

    </div>

    <div id="controls">

        <div>W A S D — Move</div>
        <div>SHIFT — Run</div>
        <div>SPACE — Jump</div>
        <div>E — Enter / Exit Vehicle</div>
        <div>I — Change Identity</div>
        <div>M — Start Mission</div>
        <div>H — Call Backup Hero</div>
        <div>F — Logan Attack</div>
        <div>G — Skyblade Attack</div>

    </div>

    <script
        type="module"
        src="./js/game.js"
    ></script>

</body>

</html>
